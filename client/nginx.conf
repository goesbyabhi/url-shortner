server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Short codes — single path segment of [a-zA-Z0-9_-]{1,32}
  # (regex beats the SPA prefix location; multi-segment paths and dot-files fall through)
  location ~ "^/[a-zA-Z0-9_-]{1,32}$" {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA
  location / {
    try_files $uri $uri/ /index.html;
  }
}
