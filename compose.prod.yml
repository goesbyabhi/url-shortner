services:
  postgres:
    image: postgres:16-alpine
    container_name: shortener-postgres-prod
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shortener-redis-prod
    volumes:
      - redisdata-prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: shortener-api-prod
    environment:
      NODE_ENV: production
      PORT: 3000
      # Public origin of short URLs — set to your https domain in real deployments
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: shortener
      PGPASSWORD: shortener
      PGDATABASE: shortener
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: shortener-web-prod
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata-prod:
  redisdata-prod:
